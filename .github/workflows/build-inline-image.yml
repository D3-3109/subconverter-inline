name: Build & push inline-mode image (ghcr)

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=inline-latest,enable={{is_default_branch}}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-yaml-cpp
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-rapidjson

      - name: Read dependency pins
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('scripts/ci/dependencies.lock.json'))['git']
          refs={'QUICKJSPP_REF':'quickjspp','LIBCRON_REF':'libcron','TOML11_REF':'toml11'}
          env=os.environ.get('GITHUB_ENV','') and open(os.environ['GITHUB_ENV'],'a')
          for k,v in refs.items():
              env.write(f"{k}={d[v]['revision']}\n")
          PY

      - name: Build Windows amd64
        shell: msys2 {0}
        run: |
          THREADS=4 BUILD_TESTS=false bash scripts/build-windows-amd64.sh \
            "${{ github.ref_name }}" "${{ github.sha }}" "$(date +%s)"

      - name: Package portable zip
        shell: pwsh
        run: |
          $build = "build/windows-amd64"
          $pkg = "SubConverter-Extended-inline"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item "$build/build/subconverter.exe" $pkg -Force
          if (Test-Path "$build/subconverter-update.exe") { Copy-Item "$build/subconverter-update.exe" $pkg -Force }
          Copy-Item base -Destination $pkg -Recurse -Force
          Get-Content "$build/runtime-dlls.txt" | ForEach-Object { Copy-Item $_ $pkg -Force }
          Compress-Archive -Path "$pkg/*" -DestinationPath "SubConverter-Extended-inline.zip" -Force
          Write-Host "Packaged:"; Get-ChildItem $pkg -Recurse | Measure-Object -Sum Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subconverter-inline-windows-amd64
          path: ./SubConverter-Extended-inline.zip
